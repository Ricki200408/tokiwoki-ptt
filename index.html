<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie-Talkie PTT</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 80px; 
            background: #121212; 
            color: #fff; 
        }
        #status { 
            font-weight: bold; 
            margin-bottom: 30px; 
            font-size: 18px; 
        }
        #ptt-btn { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            background: #ff4757; 
            color: white; 
            font-size: 16px; 
            font-weight: bold;
            border: none; 
            cursor: pointer; 
            outline: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            transition: 0.2s; 
            user-select: none;
            -webkit-user-select: none;
        }
        #ptt-btn.active { 
            background: #2ed573; 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <h1>Walkie-Talkie PTT</h1>
    <div id="status">Estado: Conectando... ⏳</div>
    <button id="ptt-btn">Mantener para Hablar</button>

    <script>
        // ⚠️ REEMPLAZA ESTA URL con tu enlace actual wss:// proporcionado por ngrok
        const WS_URL = "wss://TU-SUBDOMINIO.ngrok-free.app"; 
        
        let socket;
        let mediaRecorder;

        const statusDiv = document.getElementById("status");
        const pttBtn = document.getElementById("ptt-btn");

        function connectWebSocket() {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                statusDiv.innerHTML = "Estado: Conectado 🟢";
                statusDiv.style.color = "#2ed573";
            };

            socket.onclose = () => {
                statusDiv.innerHTML = "Estado: Desconectado (Reconectando...) 🔴";
                statusDiv.style.color = "#ff4757";
                setTimeout(connectWebSocket, 3000); // Intenta reconectar cada 3 segundos
            };

            socket.onerror = (error) => {
                console.error("Error en WebSocket:", error);
                statusDiv.innerHTML = "Estado: Error de conexión ❌";
            };

            // RECIBIR AUDIO EN TIEMPO REAL DEL OTRO DISPOSITIVO
            socket.onmessage = async (event) => {
                try {
                    const audioBlob = new Blob([event.data], { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    
                    audio.play().catch(err => {
                        console.log("Bloqueo de reproducción automática del navegador:", err);
                    });
                } catch (e) {
                    console.error("Error al procesar el audio entrante:", e);
                }
            };
        }

        // INICIAR TRANSMISIÓN (Micrófono con compatibilidad móvil)
        async function startRecording(e) {
            e.preventDefault();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Detección automática de formato compatible con móviles y PC
                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'audio/mp4' }; // Alternativa para iOS o algunos navegadores móviles
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = {}; // Deja que el navegador elija su formato predeterminado seguro
                    }
                }

                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && socket.readyState === WebSocket.OPEN) {
                        socket.send(event.data); // Envía los fragmentos de voz por el WebSocket
                    }
                };

                mediaRecorder.start(250); // Envía paquetes cada 250ms
                pttBtn.classList.add("active");
                pttBtn.innerText = "Transmitiendo...";
            } catch (err) {
                console.error("No se pudo acceder al micrófono:", err);
                alert("Permiso de micrófono denegado o no disponible: " + err.message);
            }
        }

        // DETENER TRANSMISIÓN
        function stopRecording(e) {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop()); // Libera el micrófono
            }
            pttBtn.classList.remove("active");
            pttBtn.innerText = "Mantener para Hablar";
        }

        // Eventos para Computadora (Mouse)
        pttBtn.addEventListener("mousedown", startRecording);
        pttBtn.addEventListener("mouseup", stopRecording);

        // Eventos para Celulares (Táctil)
        pttBtn.addEventListener("touchstart", startRecording);
        pttBtn.addEventListener("touchend", stopRecording);

        // Inicializar la conexión al cargar la página
        connectWebSocket();
    </script>
</body>
</html>
