<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radio PTT - Celular</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #status {
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ff5252;
        }
        #ptt-btn {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background-color: #007acc;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: 6px solid #005999;
            cursor: pointer;
            outline: none;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.6);
            user-select: none;
            -webkit-user-select: none;
        }
        #ptt-btn.active {
            background-color: #2ea44f;
            border-color: #1e6b33;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div id="status">Conectando al servidor...</div>
    <button id="ptt-btn">MANTÉN PARA<br>HABLAR</button>

    <script>
        // Tu enlace actual de ngrok convertido a wss://
        const WS_URL = "ws://192.168.100.55:8000";
        let ws;
        let audioCtx;
        let micStream;
        let processor;
        let inputNode;
        let isTransmitting = false;

        const statusEl = document.getElementById('status');
        const pttBtn = document.getElementById('ptt-btn');

        function connect() {
            ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                statusEl.innerText = "Estado: Conectado 🟢";
                statusEl.style.color = "#4caf50";
            };

            ws.onclose = () => {
                statusEl.innerText = "Estado: Desconectado (Reconectando...)";
                statusEl.style.color = "#ff5252";
                setTimeout(connect, 3000);
            };

            ws.onmessage = async (event) => {
                if (event.data instanceof ArrayBuffer) {
                    playAudioChunk(event.data);
                }
            };
        }

        async function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
                
                inputNode = audioCtx.createMediaStreamSource(micStream);
                processor = audioCtx.createScriptProcessor(1024, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!isTransmitting || !ws || ws.readyState !== WebSocket.OPEN) return;
                    
                    const inputData = e.inputBuffer.getChannelData(0);
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        let s = Math.max(-1, Math.min(1, inputData[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    ws.send(int16Data.buffer);
                };

                inputNode.connect(processor);
                processor.connect(audioCtx.destination);
            } catch (err) {
                alert("Permiso de micrófono denegado o error: " + err);
            }
        }

        async function playAudioChunk(arrayBuffer) {
            if (!audioCtx) return;
            try {
                const int16Data = new Int16Array(arrayBuffer);
                const float32Data = new Float32Array(int16Data.length);
                for (let i = 0; i < int16Data.length; i++) {
                    float32Data[i] = int16Data[i] / (int16Data[i] < 0 ? 0x8000 : 0x7FFF);
                }

                const audioBuffer = audioCtx.createBuffer(1, float32Data.length, 16000);
                audioBuffer.getChannelData(0).set(float32Data);

                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioCtx.destination);
                source.start();
            } catch (e) {
                console.error("Error reproduciendo audio:", e);
            }
        }

        function startTalk(e) {
            e.preventDefault();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isTransmitting = true;
            pttBtn.classList.add('active');
            pttBtn.innerText = "TRANSMITIENDO...";
        }

        function stopTalk(e) {
            e.preventDefault();
            isTransmitting = false;
            pttBtn.classList.remove('active');
            pttBtn.innerText = "MANTÉN PARA\nHABLAR";
        }

        // Eventos táctiles para celulares
        pttBtn.addEventListener('touchstart', startTalk);
        pttBtn.addEventListener('touchend', stopTalk);

        // Eventos de mouse (por si se prueba en PC)
        pttBtn.addEventListener('mousedown', startTalk);
        pttBtn.addEventListener('mouseup', stopTalk);

        // Activar audio del navegador al primer toque en la pantalla
        window.addEventListener('click', () => {
            if (!audioCtx) {
                initAudio();
            }
        }, { once: true });

        connect();
    </script>
</body>
</html>
