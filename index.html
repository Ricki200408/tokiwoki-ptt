<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie-Talkie PTT</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 80px; 
            background: #121212; 
            color: #fff; 
        }
        #status { 
            font-weight: bold; 
            margin-bottom: 30px; 
            font-size: 18px; 
        }
        #ptt-btn { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            background: #ff4757; 
            color: white; 
            font-size: 16px; 
            font-weight: bold;
            border: none; 
            cursor: pointer; 
            outline: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            transition: 0.2s; 
            user-select: none;
            -webkit-user-select: none;
        }
        #ptt-btn.active { 
            background: #2ed573; 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <h1>Walkie-Talkie PTT</h1>
    <div id="status">Estado: Conectando... ⏳</div>
    <button id="ptt-btn">Mantener para Hablar</button>

    <script>
        // ⚠️ Asegúrate de que esta sea tu URL actual de ngrok
        const WS_URL = "wss://cavity-expletive-parking.ngrok-free.dev"; 
        
        let socket;
        let mediaRecorder;
        let audioChunks = [];

        const statusDiv = document.getElementById("status");
        const pttBtn = document.getElementById("ptt-btn");

        function connectWebSocket() {
            // CORRECCIÓN: Se remueve el parámetro conflictivo para que Python acepte la conexión
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                statusDiv.innerHTML = "Estado: Conectado 🟢";
                statusDiv.style.color = "#2ed573";
            };

            socket.onclose = () => {
                statusDiv.innerHTML = "Estado: Desconectado (Reconectando...) 🔴";
                statusDiv.style.color = "#ff4757";
                setTimeout(connectWebSocket, 3000);
            };

            socket.onerror = (error) => {
                console.error("Error en WebSocket:", error);
                statusDiv.innerHTML = "Estado: Error de conexión ❌";
            };

            // RECIBIR Y REPRODUCIR EL AUDIO COMPLETO DEL OTRO DISPOSITIVO
            socket.onmessage = async (event) => {
                try {
                    const audioBlob = event.data instanceof Blob ? event.data : new Blob([event.data], { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    
                    audio.play().catch(err => {
                        console.log("Bloqueo de reproducción automática del navegador:", err);
                    });
                } catch (e) {
                    console.error("Error al procesar el audio entrante:", e);
                }
            };
        }

        // INICIAR GRABACIÓN AL PRESIONAR EL BOTÓN
        async function startRecording(e) {
            e.preventDefault();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = []; 

                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'audio/mp4' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = {};
                    }
                }

                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                // AL SOLTAR EL BOTÓN SE ENVÍA EL AUDIO COMPLETO
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(audioBlob); 
                    }
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                pttBtn.classList.add("active");
                pttBtn.innerText = "Transmitiendo...";
            } catch (err) {
                console.error("No se pudo acceder al micrófono:", err);
                alert("Permiso de micrófono denegado: " + err.message);
            }
        }

        // DETENER GRABACIÓN AL SOLTAR EL BOTÓN
        function stopRecording(e) {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop(); 
            }
            pttBtn.classList.remove("active");
            pttBtn.innerText = "Mantener para Hablar";
        }

        // Eventos para Computadora (Mouse)
        pttBtn.addEventListener("mousedown", startRecording);
        pttBtn.addEventListener("mouseup", stopRecording);

        // Eventos para Celulares (Táctil)
        pttBtn.addEventListener("touchstart", startRecording);
        pttBtn.addEventListener("touchend", stopRecording);

        connectWebSocket();
    </script>
</body>
</html>
