<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie-Talkie PTT Limpio</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 100px; 
            background: #121212; 
            color: #fff; 
        }
        #status { 
            font-weight: bold; 
            margin-bottom: 30px; 
            font-size: 18px; 
        }
        #ptt-btn { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            background: #ff4757; 
            color: white; 
            font-size: 16px; 
            font-weight: bold;
            border: none; 
            cursor: pointer; 
            outline: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            user-select: none;
            -webkit-user-select: none;
        }
        #ptt-btn.active { 
            background: #2ed573; 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <h1>Walkie-Talkie PTT</h1>
    <div id="status">Estado: Conectando... ⏳</div>
    <button id="ptt-btn">Mantener para Hablar</button>

    <script>
        // ⚠️ REEMPLAZA ESTA URL con tu enlace actual wss:// proporcionado por ngrok
        const WS_URL = "wss://TU-SUBDOMINIO.ngrok-free.dev"; 
        
        let socket;
        let mediaRecorder;
        let audioChunks = [];

        const statusDiv = document.getElementById("status");
        const pttBtn = document.getElementById("ptt-btn");

        function connectWebSocket() {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                statusDiv.innerHTML = "Estado: Conectado 🟢";
                statusDiv.style.color = "#2ed573";
            };

            socket.onclose = () => {
                statusDiv.innerHTML = "Estado: Desconectado (Reconectando...) 🔴";
                statusDiv.style.color = "#ff4757";
                setTimeout(connectWebSocket, 3000);
            };

            socket.onerror = (error) => {
                console.error("Error en WebSocket:", error);
                statusDiv.innerHTML = "Estado: Error de conexión ❌";
            };

            // Recibir y reproducir el audio del otro dispositivo
            socket.onmessage = async (event) => {
                try {
                    const audioBlob = event.data instanceof Blob ? event.data : new Blob([event.data], { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.play().catch(err => console.log("Bloqueo de autoplay:", err));
                } catch (e) {
                    console.error("Error al reproducir audio:", e);
                }
            };
        }

        // Iniciar grabación al presionar
        async function startRecording(e) {
            e.preventDefault();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];

                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                // Al soltar, empaquetar y enviar por el WebSocket
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(audioBlob);
                    }
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                pttBtn.classList.add("active");
                pttBtn.innerText = "Transmitiendo...";
            } catch (err) {
                console.error("Error de micrófono:", err);
                alert("No se pudo acceder al micrófono.");
            }
        }

        // Detener grabación al soltar
        function stopRecording(e) {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            pttBtn.classList.remove("active");
            pttBtn.innerText = "Mantener para Hablar";
        }

        // Eventos de Mouse (PC)
        pttBtn.addEventListener("mousedown", startRecording);
        pttBtn.addEventListener("mouseup", stopRecording);

        // Eventos Táctiles (Celular)
        pttBtn.addEventListener("touchstart", startRecording);
        pttBtn.addEventListener("touchend", stopRecording);

        connectWebSocket();
    </script>
</body>
</html>
